<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="100%" height="100%">
  <defs>
    <linearGradient id="flagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121F" />
      <stop offset="50%" stop-color="#0A0C16" />
      <stop offset="100%" stop-color="#140F24" />
    </linearGradient>
    <linearGradient id="flagBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="shimmerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Flagship Card Frame -->
  <rect x="2" y="2" width="996" height="206" rx="22" fill="url(#flagBg)" stroke="url(#flagBorder)" stroke-width="1.5" />
  <rect x="2" y="2" width="996" height="206" rx="22" fill="url(#cardGlow)" />
  <rect x="300" y="2" width="400" height="2" fill="url(#shimmerLine)" />

  <!-- Top Pill & Category -->
  <g transform="translate(36, 32)">
    <rect width="138" height="26" rx="13" fill="#131B2E" stroke="#38BDF8" stroke-width="1" />
    <text x="69" y="17" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1.2">
      FEATURED CORE
    </text>
    <text x="154" y="17" class="mono" font-size="11" fill="#64748B" letter-spacing="1">
      // OPEN-SOURCE FOUNDATION PLATFORM
    </text>
  </g>

  <!-- Project Title -->
  <text x="36" y="96" class="sans" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    P3RM4 NEXUS — Autonomous AI &amp; Web Platform
  </text>

  <!-- Project Description -->
  <text x="36" y="126" class="sans" font-size="14.5" fill="#94A3B8" letter-spacing="0.2">
    Next-generation foundation ecosystem combining multi-agent LLM orchestration, sub-millisecond edge APIs,
  </text>
  <text x="36" y="148" class="sans" font-size="14.5" fill="#94A3B8" letter-spacing="0.2">
    vector memory search (RAG), and deterministic headless browser automation clusters.
  </text>

  <!-- Badges / Tags on the Bottom -->
  <g transform="translate(36, 170)" class="mono" font-size="10.5" font-weight="600">
    <rect x="0" y="0" width="102" height="24" rx="8" fill="#141B2D" stroke="#1E293B" />
    <text x="51" y="16" fill="#38BDF8" text-anchor="middle">RUST / AXUM</text>

    <rect x="112" y="0" width="106" height="24" rx="8" fill="#141B2D" stroke="#1E293B" />
    <text x="165" y="16" fill="#A855F7" text-anchor="middle">TYPESCRIPT</text>

    <rect x="228" y="0" width="100" height="24" rx="8" fill="#141B2D" stroke="#1E293B" />
    <text x="278" y="16" fill="#10B981" text-anchor="middle">VECTOR DB</text>

    <rect x="338" y="0" width="112" height="24" rx="8" fill="#141B2D" stroke="#1E293B" />
    <text x="394" y="16" fill="#F59E0B" text-anchor="middle">MULTI-AGENT</text>

    <rect x="460" y="0" width="94" height="24" rx="8" fill="#141B2D" stroke="#1E293B" />
    <text x="507" y="16" fill="#E2E8F0" text-anchor="middle">ZERO-TRUST</text>
  </g>
</svg>
